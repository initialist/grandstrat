name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: grandstrat-linux-x86_64
            binary_name: grandstrat
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: grandstrat-windows-x86_64.exe
            binary_name: grandstrat.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: grandstrat-macos-arm64
            binary_name: grandstrat
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: grandstrat-macos-x86_64
            binary_name: grandstrat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            APP_DIR="dist/GrandStrategy.app"
            mkdir -p "$APP_DIR/Contents/MacOS"
            mkdir -p "$APP_DIR/Contents/Resources"
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} "$APP_DIR/Contents/MacOS/grandstrat"
            chmod +x "$APP_DIR/Contents/MacOS/grandstrat"
            cp Blank_Map.svg "$APP_DIR/Contents/Resources/"
            cp mapchart-config-world-1450.txt "$APP_DIR/Contents/Resources/"
            cat << 'PLIST' > "$APP_DIR/Contents/Info.plist"
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>grandstrat</string>
    <key>CFBundleIdentifier</key>
    <string>com.initialist.grandstrat</string>
    <key>CFBundleName</key>
    <string>GrandStrategy</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0.0</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>LSMinimumSystemVersion</key>
    <string>11.0</string>
    <key>NSHighResolutionCapable</key>
    <true/>
</dict>
</plist>
PLIST
            codesign --force --deep --sign - "$APP_DIR"
            cd dist && zip -y -r "${{ matrix.artifact_name }}.zip" "GrandStrategy.app" && rm -rf "GrandStrategy.app" && cd ..
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            mkdir -p dist/grandstrat-windows-x86_64
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/grandstrat-windows-x86_64/
            cp Blank_Map.svg dist/grandstrat-windows-x86_64/
            cp mapchart-config-world-1450.txt dist/grandstrat-windows-x86_64/
            cd dist && 7z a "${{ matrix.artifact_name }}.zip" "grandstrat-windows-x86_64" && rm -rf "grandstrat-windows-x86_64" && cd ..
          else
            mkdir -p dist/grandstrat-linux-x86_64
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/grandstrat-linux-x86_64/
            cp Blank_Map.svg dist/grandstrat-linux-x86_64/
            cp mapchart-config-world-1450.txt dist/grandstrat-linux-x86_64/
            cd dist && tar -czvf "${{ matrix.artifact_name }}.tar.gz" "grandstrat-linux-x86_64" && rm -rf "grandstrat-linux-x86_64" && cd ..
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest tag
        id: latest_tag
        shell: bash
        run: |
          latest_tag="$(git tag --sort=-version:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "No tags found; cannot create a release."
            exit 1
          fi
          echo "value=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.latest_tag.outputs.value }}
          name: ${{ steps.latest_tag.outputs.value }}
          files: artifacts/**/*
          generate_release_notes: true
