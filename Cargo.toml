[package]
name = "grandstrat"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
glow = "0.16"
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
